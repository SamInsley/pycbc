name: 3G live image

# Builds the merged Dockerfile natively on x86_64 GitHub runners (no QEMU),
# pushes the Docker image to ghcr.io, then converts it to a Singularity/Apptainer
# .sif and pushes that too as an ORAS artifact. On the cluster you then only do:
#
#   apptainer pull oras://ghcr.io/<owner>/pycbc-3g-live-sif:latest
#
# i.e. a plain blob download, no squashfs / extraction on the cluster.

on:
  workflow_dispatch:
  push:
    branches: [3G-main-branch]
    paths:
      - 'pycbc/**'
      - 'bin/**'
      - 'requirements*.txt'
      - 'companion.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/3g-live-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pycbc-3g-live
      SIF_REPO: ghcr.io/${{ github.repository_owner }}/pycbc-3g-live-sif
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune -af || true
          df -h / /mnt

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reclaim disk before SIF conversion
        run: |
          docker buildx prune -af || true
          docker system prune -af || true
          sudo mkdir -p /mnt/apptainer/tmp /mnt/apptainer/cache
          sudo chown -R "$(id -un)" /mnt/apptainer
          df -h / /mnt

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build .sif and push to GHCR (ORAS)
        env:
          APPTAINER_TMPDIR: /mnt/apptainer/tmp
          APPTAINER_CACHEDIR: /mnt/apptainer/cache
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          sha_short=$(git rev-parse --short HEAD)

          export MKSQUASHFS_ARGS='-comp zstd -Xcompression-level 3 -processors 4'
          apptainer build image.sif "docker://${IMAGE}:latest"

          ls -lh image.sif
          apptainer inspect image.sif || true

          echo "${APPTAINER_DOCKER_PASSWORD}" | \
            apptainer registry login --username "${APPTAINER_DOCKER_USERNAME}" --password-stdin oras://ghcr.io
          apptainer push image.sif "oras://${SIF_REPO}:latest"
          apptainer push image.sif "oras://${SIF_REPO}:sha-${sha_short}"
